<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Management</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222;
        }

        nav {
            background: #343a40;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .brand {
            color: white;
            font-size: 20px;
        }

        nav a {
            color: #dddddd;
            text-decoration: none;
            margin-left: 22px;
        }

        nav a:hover,
        nav a.active {
            color: white;
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1, h2 {
            margin-bottom: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            text-align: left;
            border-bottom: 2px solid #ddd;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }

        .message {
            margin: 15px 0;
            padding: 10px;
            display: none;
        }

        .success {
            display: block;
            background: #e7f6e7;
        }

        .error {
            display: block;
            background: #f8dddd;
        }

        #orderDetails {
            margin-top: 50px;
            border-top: 2px solid #333;
            padding-top: 25px;
            display: none;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

<nav>
    <div class="brand">
        Store Management
    </div>

    <div>
        <a href="/products">Product Management</a>
        <a href="/users">User Management</a>
        <a href="/orders" class="active">Order Management</a>
    </div>
</nav>

<main>

    <div class="top-bar">
        <h1>Order Management</h1>

        <button onclick="loadOrders()">
            Refresh Orders
        </button>
    </div>

    <div id="message" class="message"></div>

    <h2>My Orders</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Email</th>
                <th>Total</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="ordersTableBody">
        </tbody>
    </table>


    <section id="orderDetails">

        <h2 id="detailTitle">
            Order Details
        </h2>

        <div class="detail-grid">
            <div>
                <strong>User:</strong>
                <span id="detailUser"></span>
            </div>

            <div>
                <strong>Email:</strong>
                <span id="detailEmail"></span>
            </div>

            <div>
                <strong>Total:</strong>
                $<span id="detailTotal"></span>
            </div>

            <div>
                <strong>Status:</strong>
                <span id="detailStatus"></span>
            </div>

            <div>
                <strong>Created At:</strong>
                <span id="detailDate"></span>
            </div>
        </div>

        <h2>Order Items</h2>

        <table>
            <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                    <th>Subtotal</th>
                </tr>
            </thead>

            <tbody id="orderItemsBody">
            </tbody>
        </table>

    </section>

</main>

<script src="{{ url_for('static', filename='scriptOrders.js') }}"></script>

</body>
</html>
